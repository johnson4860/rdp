官方说明：GitHub Actions Billing

我建议我们下一步先讨论监控逻辑，不急着写代码。重点是确保它能够发现：

Microsoft 发布新的 Windows KB。

RDP Wrapper 出现新的 Build Issue。

旧 Issue 出现新的 INI 评论。

已有配置被更新或出现新的兼容性报告。

这样才真正能解决你跟不上 Patch 的问题。

如何设置

Worked for 8s
我们可以直接在你现有的 GitHub Repository johnson4860/rdp 设置，不需要另外开 Repository，也不需要购买 GitHub Actions。

我建议分阶段进行，先建立一个 RDP Update Monitor，确认自动运行正常，再加入 Windows Patch 和 RDP Wrapper Issue 监控。

第一步：确认 Repository
打开你的 Repository：

johnson4860/rdp — GitHub Repository
先确认它是 Public 还是 Private。

两种都可以使用 GitHub Actions，只是免费额度不同。

第二步：建立 Actions Workflow
在 Repository 里面：

点击 Actions。

点击 New workflow。

选择 set up a workflow yourself。

将文件命名为：

.github/workflows/rdp-monitor.yml
GitHub 会自动建立 .github/workflows 文件夹。

第三步：放入测试配置
先不要急着编写完整的监控程序。我们先确认 GitHub Actions 可以正常运行。

把以下内容复制到 rdp-monitor.yml：


name: RDP Update Monitor

on:
  workflow_dispatch:

  schedule:
    # Every day at 8:00 AM and 8:00 PM Malaysia time
    - cron: "0 0,12 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check monitor
        run: |
          echo "RDP Update Monitor Started"
          echo "Date: $(date -u)"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Status: Running"

这个配置目前只负责测试运行，不会修改你的 rdpwrap.ini。

