第四步：保存并启动
点击右上角 Commit changes。

确认文件保存到 main branch。

打开 Repository 的 Actions 页面。

左侧选择 RDP Update Monitor。

点击 Run workflow。

再点击绿色的 Run workflow 按钮。

GitHub Actions入門
成功标准
看到绿色勾号，并且 Log 出现：

RDP Update Monitor Started
Repository: johnson4860/rdp
Status: Running
就代表第一阶段完成。

