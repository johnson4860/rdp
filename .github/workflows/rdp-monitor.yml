
name: RDP Update Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0,12 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check monitor
        run: |
          echo "RDP Update Monitor Started"
          echo "Date: $(date -u)"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Status: Running"
